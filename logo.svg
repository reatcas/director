<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="50%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee"/>
      <stop offset="40%" stop-color="#00aaff"/>
      <stop offset="70%" stop-color="#8844ff"/>
      <stop offset="100%" stop-color="#ff44aa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8844ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff44aa" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="url(#dGrad)" stroke-width="1.5" opacity="0.25"/>

  <!-- Musical staff lines (subtle) -->
  <g opacity="0.06" stroke="#00ffee" stroke-width="1">
    <line x1="60" y1="160" x2="452" y2="160"/>
    <line x1="60" y1="200" x2="452" y2="200"/>
    <line x1="60" y1="240" x2="452" y2="240"/>
    <line x1="60" y1="320" x2="452" y2="320"/>
    <line x1="60" y1="360" x2="452" y2="360"/>
  </g>

  <!-- Outer glow of D -->
  <text x="256" y="330" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="280" fill="url(#dGrad)" filter="url(#outerGlow)" opacity="0.4">D</text>

  <!-- Main D letter -->
  <text x="256" y="330" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="280" fill="url(#dGrad)" filter="url(#glow)">D</text>

  <!-- Highlight reflection on D -->
  <text x="256" y="330" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="280" fill="url(#glowGrad)" opacity="0.3">D</text>

  <!-- Small treble clef accent -->
  <text x="390" y="160" font-size="48" fill="#00ffee" opacity="0.2" font-family="serif">&#119070;</text>

  <!-- Waveform bars (bottom-right accent) -->
  <g transform="translate(360, 380)" opacity="0.3">
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="#00ffee"/>
    <rect x="8" y="-20" width="4" height="40" rx="2" fill="#00aaff"/>
    <rect x="16" y="-8" width="4" height="16" rx="2" fill="#8844ff"/>
    <rect x="24" y="-16" width="4" height="32" rx="2" fill="#ff44aa"/>
    <rect x="32" y="-10" width="4" height="20" rx="2" fill="#00ffee"/>
  </g>

  <!-- AI circuit dots (subtle) -->
  <g fill="#00ffee" opacity="0.12">
    <circle cx="80" cy="420" r="3"/>
    <circle cx="100" cy="430" r="2"/>
    <circle cx="90" cy="410" r="2"/>
    <line x1="80" y1="420" x2="100" y2="430" stroke="#00ffee" stroke-width="0.8"/>
    <line x1="80" y1="420" x2="90" y2="410" stroke="#00ffee" stroke-width="0.8"/>
  </g>
</svg>
